name: DevOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Build Message
        run: echo "Building DevOps Web Application..."

      - name: Test HTML File
        run: |
          test -f index.html
          echo "Test passed: index.html exists"

      - name: Generate Build Log
        run: |
          echo "Build completed successfully"
          date
